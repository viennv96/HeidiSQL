name: Build macOS Intel (x86_64, macOS 14+)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/commit của HeidiSQL gốc để build"
        default: "lazarus"
        required: true
      debug:
        description: "Build Debug (có số dòng code trong báo lỗi, chậm hơn)"
        type: boolean
        default: false
  push:
    branches: [ master ]
    paths: [ ".github/workflows/build-macos-intel.yml" ]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: macOS x86_64 app bundle
    runs-on: macos-15-intel
    env:
      GITHUB: 1
      LAZ_URL: "https://sourceforge.net/projects/lazarus/files/Lazarus%20macOS%20x86-64/Lazarus%204.8/lazarus-darwin-x86_64-4.8.zip"
      FPC_URL: "https://sourceforge.net/projects/lazarus/files/Lazarus%20macOS%20x86-64/Lazarus%204.8/fpc-3.2.4rc1a.intelarm64-macosx.dmg"
      MIN_MACOS: "14.0"
      DEBUG_BUILD: ${{ github.event.inputs.debug == 'true' && '1' || '0' }}
    steps:
      - name: Checkout HeidiSQL (upstream, Lazarus branch)
        uses: actions/checkout@v6
        with:
          repository: HeidiSQL/HeidiSQL
          ref: ${{ github.event.inputs.ref || 'lazarus' }}

      - name: Checkout fork (local patches and CI helpers)
        uses: actions/checkout@v6
        with:
          path: _fork
          sparse-checkout: |
            patches
            ci

      - name: Apply local patches
        run: |
          shopt -s nullglob
          for p in _fork/patches/*.patch; do
            echo "Applying $p"
            patch -p1 --forward < "$p"
          done
          echo "::notice title=local patches::$(ls _fork/patches/*.patch 2>/dev/null | xargs -n1 basename | tr '\n' ' ')"

      - name: Check runner architecture
        run: |
          uname -m
          sw_vers
          test "$(uname -m)" = "x86_64"

      - name: Cache Lazarus/FPC installers
        uses: actions/cache@v6
        with:
          path: ~/lazarus-installers
          key: lazarus48-installers-macos-x86_64-fpc-3.2.4rc1a

      - name: Install FPC 3.2.4rc1a + Lazarus 4.8 (x86_64)
        run: |
          C="$HOME/lazarus-installers"; mkdir -p "$C"
          [ -s "$C/fpc.dmg" ]      || curl -fL --retry 5 -o "$C/fpc.dmg" "$FPC_URL"
          [ -s "$C/lazarus.zip" ]  || curl -fL --retry 5 -o "$C/lazarus.zip" "$LAZ_URL"
          sudo hdiutil attach "$C/fpc.dmg"
          FPC_VOL=$(ls -d /Volumes/fpc* | head -1)
          FPC_PKG=$(find "$FPC_VOL" -maxdepth 1 -name "*.pkg" | head -1)
          sudo installer -package "$FPC_PKG" -target /
          sudo hdiutil detach "$FPC_VOL"
          xattr -cr "$C/lazarus.zip"
          unzip -q "$C/lazarus.zip" -d "$RUNNER_TEMP"
          sed -i '' 's|"/Developer/lazarus/"|"'$RUNNER_TEMP'/lazarus/"|g' "$RUNNER_TEMP/lazarus/config/environmentoptions.xml" 2>/dev/null || true
          sudo ln -sf "$RUNNER_TEMP/lazarus/lazbuild" /usr/local/bin/lazbuild
          echo "$RUNNER_TEMP/lazarus" >> "$GITHUB_PATH"
          fpc -iV; fpc -iTP

      - name: Patch Lazarus 4.8 (same patches as upstream CI)
        run: |
          LAZARUS_DIR="$RUNNER_TEMP/lazarus"
          for p in extra/lazarus-patches/4.8/*.patch; do
            patch -d "$LAZARUS_DIR" -p1 --dry-run < "$p"
            patch -d "$LAZARUS_DIR" -p1 < "$p"
          done

      - name: Test enum-key TDictionary with this FPC
        run: |
          mkdir -p _enumtest
          fpc -O1 -FE_enumtest _fork/ci/enumdict_test.pas >/dev/null
          OUT=$(./_enumtest/enumdict_test)
          echo "$OUT"
          echo "::notice title=FPC enum dictionary test::$OUT"

      - name: Install FreeTDS
        run: brew install freetds

      - name: Build HeidiSQL
        run: |
          if [ "$DEBUG_BUILD" = "1" ]; then
            # Debug mode + line info unit, so HeidiSQL's exception dialog shows unit:line
            perl -0pi -e 's|(<DebugInfoType Value="dsDwarf3"/>)|$1<UseLineInfoUnit Value="True"/>|' heidisql.lpi
            make build-macos OPTS="-B --bm=Debug"
            dsymutil out/macos/heidisql -o out/macos/heidisql.dSYM
            ls out/macos/heidisql.dSYM/Contents/Resources/DWARF/
          else
            make build-macos
          fi
          file out/macos/heidisql
          lipo -archs out/macos/heidisql | grep -q x86_64

      - name: Create app bundle (ad-hoc signed, min macOS 14)
        run: |
          sed -i '' "s|<string>15.0</string>|<string>${MIN_MACOS}</string>|" create-macos-app.sh
          grep -n "LSMinimumSystemVersion" -A1 create-macos-app.sh
          ./create-macos-app.sh --adhoc

      - name: Lower minimum OS of bundled binaries to macOS 14
        run: |
          set +o pipefail
          SDK=$(xcrun --show-sdk-version)
          is_macho() { file "$1" | grep -q "Mach-O"; }
          get_minos() { vtool -show-build "$1" 2>/dev/null | awk '/minos|^ *version/ {print $2; exit}' || true; }

          find heidisql.app/Contents -type f > files.txt
          while read -r f; do
            is_macho "$f" || continue
            MINOS=$(get_minos "$f")
            if [ -n "$MINOS" ] && [ "${MINOS%%.*}" -gt 14 ]; then
              if vtool -set-build-version macos "$MIN_MACOS" "$SDK" -replace -output "$f.tmp" "$f"; then
                mv "$f.tmp" "$f"
                echo "minos $MINOS -> $MIN_MACOS : $f"
              else
                rm -f "$f.tmp"
                echo "::warning::vtool failed on ${f#heidisql.app/} (minos $MINOS)"
              fi
            fi
          done < files.txt

          if [ -d out/macos/heidisql.dSYM ]; then
            cp -R out/macos/heidisql.dSYM heidisql.app/Contents/MacOS/
          fi
          find heidisql.app/Contents -type f \( -name "*.dylib" -o -name "*.so" \) -exec codesign --force --sign - {} \;
          codesign --force --deep --sign - heidisql.app
          codesign --verify --deep --verbose=2 heidisql.app || echo "::warning::codesign verify reported issues"

          SUMMARY=""
          while read -r f; do
            if is_macho "$f"; then
              SUMMARY="$SUMMARY $(get_minos "$f"):$(basename "$f");"
            fi
          done < files.txt
          rm -f files.txt
          echo "::notice title=minos after patch::$SUMMARY"
          echo "::notice title=main executable::$(file heidisql.app/Contents/MacOS/heidisql | sed 's/.*: //')"

      - name: Get version info
        id: ver
        run: |
          V=$(xmllint --xpath 'concat(//VersionInfo/MajorVersionNr/@Value,".",//VersionInfo/MinorVersionNr/@Value,".",//VersionInfo/RevisionNr/@Value,".",//VersionInfo/BuildNr/@Value)' heidisql.lpi 2>/dev/null || echo "0.0")
          V=$(echo "$V" | sed 's/\.*$//; s/\.\.*/./g')
          SHA=$(git rev-parse --short HEAD)
          if [ "$DEBUG_BUILD" = "1" ]; then V="$V-debug"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "::notice title=version::$V ($SHA)"

      - name: Zip app bundle
        run: /usr/bin/ditto -c -k --keepParent heidisql.app "HeidiSQL-${{ steps.ver.outputs.version }}-macos-x86_64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: HeidiSQL-macos-x86_64
          path: HeidiSQL-*-macos-x86_64.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.sha }}-macos-x86_64
          target_commitish: ${{ github.sha }}
          name: HeidiSQL ${{ steps.ver.outputs.version }} – macOS Intel (x86_64)
          make_latest: ${{ github.event.inputs.debug != 'true' }}
          prerelease: ${{ github.event.inputs.debug == 'true' }}
          files: HeidiSQL-*-macos-x86_64.zip
          body: |
            Bản build không chính thức của HeidiSQL cho **macOS Intel (x86_64)**, chạy từ **macOS 14 Sonoma** trở lên.

            - Mã nguồn: [HeidiSQL/HeidiSQL@${{ steps.ver.outputs.sha }}](https://github.com/HeidiSQL/HeidiSQL/commit/${{ steps.ver.outputs.sha }}) (branch `${{ github.event.inputs.ref || 'lazarus' }}`)
            - Build ngày ${{ steps.ver.outputs.date }} bằng FPC 3.2.4rc1a + Lazarus 4.8 trên runner `macos-15-intel`
            - Ký ad-hoc, chưa notarize

            **Cài đặt:** giải nén, kéo `heidisql.app` vào Applications, rồi chạy:
            ```
            xattr -cr /Applications/heidisql.app
            ```
